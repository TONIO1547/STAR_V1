; STAR - firmware ESP32 (servos canon/guet, moteurs, laser verrouille)
; Arduino core 2.x (espressif32@6.9.0) : l'API ledcSetup/ledcAttachPin y existe.

[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
  madhephaestus/ESP32Servo@3.0.5
build_flags =
  -DCORE_DEBUG_LEVEL=1
